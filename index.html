<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You, My Beautiful</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Romantic & Girlish Palette */
            --bg-light-cream: #FAF5EF;
            --bg-blush-gradient: radial-gradient(circle at top, #FFF9FA 0%, #FAF5EF 100%);
            --accent-rose-gold: #D6B2A3;
            --accent-blush: #FFEFED;
            --accent-warm-gold: #CBB17E;
            --text-deep-mauve: #543D54;
            --text-lato: 'Lato', sans-serif;
            --text-playfair: 'Playfair Display', serif;
            --panel-blush-glass: rgba(255, 253, 250, 0.85);
            --photo-border: #FFFAF8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-light-cream);
            color: var(--text-deep-mauve);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--text-lato);
            background: var(--bg-blush-gradient);
            background-image: var(--bg-blush-gradient), url('https://i.ibb.co/V9z0k9m/floral-bokeh.png');
            background-repeat: repeat-y;
            background-position: top center;
            background-size: cover;
            overflow-x: hidden;
        }

        /* Giant Background Rose Watermarks */
        .bg-decor {
            position: fixed;
            font-size: 15rem;
            opacity: 0.12; /* Soft transparency so it acts like a watermark */
            z-index: 1;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 0 20px rgba(255, 182, 193, 0.5));
        }
        .decor-1 { top: -50px; left: -50px; transform: rotate(45deg); font-size: 18rem; }
        .decor-2 { bottom: 10%; right: -50px; transform: rotate(-30deg); font-size: 22rem; }
        .decor-3 { top: 40%; left: -80px; transform: rotate(15deg); font-size: 16rem; }
        .decor-4 { top: 15%; right: -60px; transform: rotate(-45deg); font-size: 14rem; }
        .decor-5 { bottom: -50px; left: 10%; transform: rotate(80deg); font-size: 20rem; }
        .decor-6 { top: 60%; right: 10%; transform: rotate(20deg); font-size: 15rem; opacity: 0.08; }

        /* Falling Rose Petals Animation */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 15px 0 15px 0;
            opacity: 0.7;
            box-shadow: 0 0 10px rgba(255, 154, 158, 0.4);
            animation: fall linear infinite;
        }
        /* Individual Petal Settings */
        .petal:nth-child(1) { left: 10%; width: 18px; height: 18px; animation-duration: 12s; animation-delay: 0s; }
        .petal:nth-child(2) { left: 25%; width: 14px; height: 14px; animation-duration: 16s; animation-delay: -2s; background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 100%); }
        .petal:nth-child(3) { left: 40%; width: 22px; height: 22px; animation-duration: 14s; animation-delay: -5s; }
        .petal:nth-child(4) { left: 55%; width: 16px; height: 16px; animation-duration: 15s; animation-delay: -1s; }
        .petal:nth-child(5) { left: 70%; width: 25px; height: 25px; animation-duration: 13s; animation-delay: -7s; background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 100%); }
        .petal:nth-child(6) { left: 85%; width: 15px; height: 15px; animation-duration: 17s; animation-delay: -3s; }
        .petal:nth-child(7) { left: 95%; width: 20px; height: 20px; animation-duration: 11s; animation-delay: -6s; }
        .petal:nth-child(8) { left: 5%; width: 15px; height: 15px; animation-duration: 15s; animation-delay: -4s; }
        .petal:nth-child(9) { left: 35%; width: 19px; height: 19px; animation-duration: 13s; animation-delay: -8s; }
        .petal:nth-child(10) { left: 80%; width: 17px; height: 17px; animation-duration: 16s; animation-delay: -1s; }
        .petal:nth-child(11) { left: 50%; width: 21px; height: 21px; animation-duration: 12s; animation-delay: -9s; background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 100%); }
        .petal:nth-child(12) { left: 15%; width: 16px; height: 16px; animation-duration: 14s; animation-delay: -2s; }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translateY(50vh) rotate(180deg) scale(1.1); opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1); opacity: 0; }
        }

        header {
            text-align: center;
            padding: 4rem 1rem 2rem;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: var(--text-playfair);
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 5px rgba(84, 61, 84, 0.1);
        }

        h1::after {
            content: '🌹'; /* Rose ornament */
            font-size: 1.8rem;
            display: block;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
        }

        .section-title {
            font-family: var(--text-playfair);
            font-size: 2.2rem;
            color: var(--accent-warm-gold);
            margin: 4rem 0 3rem;
            text-align: center;
            width: 100%;
            font-weight: 700;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 6rem;
            position: relative;
            z-index: 10; /* Ensures content is above flowers */
        }

        /* Memories Gallery - Scattered Scrapbook Look (Preserved Sizes) */
        .gallery {
            display: block;
            position: relative;
            width: 100%;
            padding: 0 2%;
            margin-bottom: 5rem;
        }

        .memory-item-frame {
            display: block;
            position: relative;
            max-width: 100%;
            transition: all 0.4s ease;
            filter: sepia(15%) grayscale(10%); 
            box-shadow: 3px 6px 15px rgba(84, 61, 84, 0.2);
            background: var(--photo-border);
            padding: 12px 12px 45px 12px; 
            border-radius: 6px;
            text-align: center;
            overflow: hidden;
            border: 1px solid rgba(214, 178, 163, 0.2);
        }

        .memory-item-frame img,
        .memory-item-frame video {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        .memory-item-frame:hover, .memory-item-frame:active {
            filter: sepia(0%) grayscale(0%);
            transform: scale(1.08) rotate(0deg) !important; 
            box-shadow: 8px 15px 30px rgba(84, 61, 84, 0.35);
            z-index: 1000;
        }

        video.memory-item-frame {
            background: #000;
            padding: 0;
            border: none;
            overflow: hidden;
        }

        /* Scattered Variations - Increased Sizes Preserved */
        .gallery .memory-item-frame:nth-child(5n+1) { width: 42%; float: left; clear: both; transform: rotate(-3deg); margin-top: 15px; }
        .gallery .memory-item-frame:nth-child(5n+2) { width: 38%; float: right; transform: rotate(4deg) translate(20px, 0); margin-top: -30px; }
        .gallery .memory-item-frame:nth-child(5n+3) { width: 48%; margin: 40px auto 0; transform: rotate(1.5deg) translate(0px, 30px); z-index: 10; }
        .gallery .memory-item-frame:nth-child(5n+4) { width: 35%; float: right; clear: both; transform: rotate(-2deg) translate(-20px, -20px); margin-top: 15px; }
        .gallery .memory-item-frame:nth-child(5n) { width: 44%; float: left; transform: rotate(2deg) translate(25px, 25px); margin-top: 25px; }

        /* Overlapping on different columns */
        .gallery .memory-item-frame:nth-child(even) { margin-right: -12%; }
        .gallery .memory-item-frame:nth-child(odd) { margin-left: -8%; }

        /* Secret Code Section */
        .secret-panel {
            background: var(--panel-blush-glass);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(214, 178, 163, 0.4);
            border-radius: 16px;
            padding: 4rem 3rem;
            text-align: center;
            margin-top: 3rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 40px rgba(84, 61, 84, 0.15);
            position: relative;
        }

        .secret-panel h3 {
            font-family: var(--text-playfair);
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-deep-mauve);
            margin-bottom: 1rem;
        }

        .secret-panel p {
            margin-bottom: 2rem;
            color: var(--text-deep-mauve);
            opacity: 0.8;
            font-weight: 300;
        }

        input[type="password"] {
            font-family: var(--text-lato);
            background: #fff;
            border: 1px solid var(--accent-rose-gold);
            color: var(--text-deep-mauve);
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 1.1rem;
            width: 85%;
            max-width: 300px;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            transition: box-shadow 0.3s;
        }

        input[type="password"]::placeholder {
            letter-spacing: normal;
            font-style: italic;
            color: #b5a4a4;
        }

        input[type="password"]:focus {
            box-shadow: 0 0 15px rgba(214, 178, 163, 0.4);
            border-color: var(--accent-warm-gold);
        }

        button {
            font-family: var(--text-playfair);
            background: var(--accent-rose-gold);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 2px 4px 10px rgba(84, 61, 84, 0.1);
        }

        button:hover {
            background: var(--accent-warm-gold);
            transform: translateY(-2px);
            box-shadow: 3px 6px 15px rgba(84, 61, 84, 0.15);
        }

        #error-msg {
            color: #d9534f;
            margin-top: 15px;
            height: 20px;
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.3s;
            font-style: italic;
        }

        /* Final Video Wrapper */
        #final-surprise {
            display: none;
            width: 100%;
            max-width: 850px;
            margin-top: 3rem;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(84, 61, 84, 0.3);
            border: 4px solid var(--photo-border);
            animation: fadeIn 1s forwards;
            background: #000;
        }

        #final-surprise video {
            width: 100%;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gallery:after {
            content: "";
            display: table;
            clear: both;
        }

        /* Mobile Optimization: Makes photos large and stacked on smaller screens */
        @media (max-width: 768px) {
            .gallery { padding: 0; }
            .gallery .memory-item-frame:nth-child(n) {
                width: 85%;
                float: none;
                display: block;
                margin: 0 auto 30px auto !important;
                transform: none !important;
            }
            .gallery .memory-item-frame:nth-child(even) { transform: rotate(2deg) !important; }
            .gallery .memory-item-frame:nth-child(odd) { transform: rotate(-2deg) !important; }
            .gallery .memory-item-frame:hover, 
            .gallery .memory-item-frame:active { transform: scale(1.05) rotate(0deg) !important; }
            h1 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <!-- Background Floral Decor -->
    <div class="bg-decor decor-1">🌹</div>
    <div class="bg-decor decor-2">🌸</div>
    <div class="bg-decor decor-3">🌺</div>
    <div class="bg-decor decor-4">🌹</div>
    <div class="bg-decor decor-5">🌸</div>
    <div class="bg-decor decor-6">🌺</div>

    <!-- Falling Petals Animation -->
    <div class="petals-container">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
    </div>

    <header>
        <h1>Happy Birthday Samiiii</h1>
    </header>

    <div class="container">
        
        <h2 class="section-title">Our Memories</h2>
        
        <div class="gallery">
            <div class="memory-item-frame"><img src="images/20260719_162106_045102.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG_20260330_181937.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG_20260613_141000.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG_20260620_142800.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260707-WA0036.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260707-WA0041.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260707-WA0044.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260709-WA0045.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260711-WA0045.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260802-WA0026.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260809-WA0024.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260817-WA0009.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260824-WA0016.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260905-WA0025.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260906-WA0008.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260909-WA0058.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260909-WA0065.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260909-WA0104.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260909-WA0181.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260909-WA0314.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260909-WA0317.jpg" alt="Memory" loading="lazy"></div>
            <div class="memory-item-frame"><img src="images/IMG-20260909-WA0344.jpg" alt="Memory" loading="lazy"></div>

            <div class="memory-item-frame"><img src="images/photostudio_1781369141744.jpg" alt="Memory" loading="lazy"></div>
            <video src="images/memory.mp4" class="memory-item-frame" muted loop autoplay playsinline></video>
        </div>

        <h2 class="section-title">One Last Surprise</h2>
        
        <div class="secret-panel" id="lock-screen">
            <h3>Secret Code Required</h3>
            <p>A final gift for you, only accessible with the secret word.</p>
            <input type="password" id="passcode" placeholder="Enter secret word">
            <br>
            <button onclick="checkCode()">Unlock</button>
            <div id="error-msg">Incorrect code. Try again.</div>
        </div>

        <div id="final-surprise">
            <video id="surprise-video" src="images/surprise.mp4" controls playsinline></video>
        </div>

    </div>

    <script>
        function checkCode() {
            const input = document.getElementById('passcode').value.toLowerCase().trim();
            const errorMsg = document.getElementById('error-msg');
            const lockScreen = document.getElementById('lock-screen');
            const finalSurprise = document.getElementById('final-surprise');
            const videoElement = document.getElementById('surprise-video');
            
            const correctCode = "samisachi"; 

            if (input === correctCode) {
                lockScreen.style.display = 'none';
                finalSurprise.style.display = 'block';
                videoElement.play();
            } else {
                errorMsg.style.opacity = '1';
                setTimeout(() => {
                    errorMsg.style.opacity = '0';
                }, 2000);
            }
        }

        document.getElementById('passcode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkCode();
            }
        });
    </script>
</body>
</html>
